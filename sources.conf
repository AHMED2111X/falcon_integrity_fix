# ============================================================
# FALCON KEYBOX SYNC — مصادر الكيبوكس
# الصيغة: الاسم|الرابط|الترميز
#
# الترميزات المدعومة:
#   plain  = ملف XML مباشر
#   b64    = base64 (طبقة أو أكثر)
#   hex    = نص hex (يُفكّ ثم base64 تلقائياً إن لزم)
#   b64hex = طبقات base64 ثم hex ثم rot13
#
# يمكنك إضافة سطرك الخاص (سيرفرك مثلاً) في أي مكان —
# تُجرَّب المصادر بالترتيب من الأعلى للأسفل وأول مصدر صالح يُثبَّت.
# ============================================================
# ⚠️ (تحديث v3.31 — 16-11-2026):
#   1) Yurikey70 أحدث كيبوكس عام موثوق (13-11-2026) — يُجرَّب أولاً.
#   2) Evolution-X يقدّم نفس الشهادة بتغليف مستقر — مصدر احتياطي.
#   3) davidepalma يقدّم نفس الشهادة أيضاً — مصدر احتياطي ثالث.
#   4) TrickyStoreOSS (7513) قديم/غير صادر عن Google — للطوارئ فقط في النهاية.
#   5) مرآة jsdelivr تعمل عندما يكون GitHub محجوباً من الهاتف.
