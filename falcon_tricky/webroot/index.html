<script>
(function () {
  var cmd = 'am start -n com.falcon.tricky/.MainActivity --user 0';
  var done = false;
  function finish() {
    if (done) return; done = true;
    setTimeout(function () { try { window.close(); } catch (e) {} }, 600);
  }
  try {
    if (typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function') {
      ksu.exec(cmd, '{}', function (ec, out) { finish(); });
      setTimeout(finish, 2500);
      return;
    }
  } catch (e) {}
  setTimeout(function () { location.href = 'webui.html'; }, 1200);
})();
</script>
